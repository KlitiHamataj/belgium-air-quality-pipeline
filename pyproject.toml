[project]
name = "belgium-air-quality-pipeline"
version = "1.0.0"
description = "ELT pipeline for Belgian air quality monitoring data"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]