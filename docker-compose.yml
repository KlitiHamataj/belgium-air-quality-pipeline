version: "3.8"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment:
    - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
    - AIRFLOW__WEBSERVER__SECRET_KEY=change-me-in-production
  volumes:
    - ./dags:/opt/airflow/dags
    - .:/opt/airflow/project
    - ./data:/opt/airflow/project/data
    - airflow-data:/opt/airflow

services:
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: >
      -c "airflow db init && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@localhost --password admin"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data

  # Optional BI layer: docker compose --profile metabase up --build
  # Reads the snapshot written by `python -m src.bi.snapshot` (or the DAG's last
  # task), never the live warehouse. See docs/operations/metabase.md.
  metabase:
    profiles: ["metabase"]
    build:
      context: .
      dockerfile: docker/Dockerfile.metabase
    ports:
      - "3000:3000"
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
    volumes:
      # Mount the directory, not the file: the snapshot is replaced by rename,
      # and a file bind mount would keep pointing at the old copy.
      - ./data/warehouse/metabase:/warehouse:ro
      - metabase-data:/metabase-data

volumes:
  airflow-data:
  metabase-data: